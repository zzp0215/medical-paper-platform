# ============================================
# 可选管理工具 - 单独文件 (避免 docker-compose v1 不支持 profiles)
# ============================================
# 启动:  docker-compose -f docker-compose.yml -f docker-compose.admin.yml up -d
# 关闭:  docker-compose -f docker-compose.admin.yml down
# 访问:
#   pgAdmin        http://localhost:5050  (admin@medpaper.local / admin)
#   RedisInsight   http://localhost:8001
#   Kibana         http://localhost:5601  (elastic / es_dev_pwd)
# ============================================

version: "3.7"

services:
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: medpaper-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@medpaper.local
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - medpaper-net
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "2"

  redis-insight:
    image: redis/redisinsight:2.58
    container_name: medpaper-redis-insight
    restart: unless-stopped
    ports:
      - "${REDIS_INSIGHT_PORT:-8001}:5540"
    networks:
      - medpaper-net
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "2"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: medpaper-kibana
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_PASSWORD:-change-me-in-prod}
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    depends_on:
      - elasticsearch
    networks:
      - medpaper-net
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "2"

volumes:
  pgadmin_data:
    name: medpaper_pgadmin_data
