# ============================================
# RAGFlow 知识库 (Phase 1.2.2 - 可选)
# ============================================
# 注意: RAGFlow 自带 MySQL + ES + MinIO + Redis, 与平台主服务端口冲突
# 必须用独立 compose 文件, 通过 `docker-compose -f docker-compose.yml -f docker-compose.ragflow.yml` 一起跑
# (网络复用 medpaper-net)
#
# 启动前必读
# -----------
# RAGFlow 完整部署需要 ≥8GB RAM, 启动慢 (3-5 分钟).
# 如要快速验证 Phase 1.2.2, 建议先跑 `scripts/verify_kb_basic.py` 走平台主栈 (PostgreSQL+Milvus+ES),
# 跑通后再用本文件启 RAGFlow.
#
# 启动:  docker-compose -f docker-compose.yml -f docker-compose.ragflow.yml up -d ragflow
# 访问:  http://localhost:9380  (RAGFlow Web UI)
#        默认账号 admin / admin (首次登录强制改密)
# ============================================

version: "3.7"

services:
  ragflow-mysql:
    image: mysql:8.0
    container_name: medpaper-ragflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ragflow_dev_pwd
      MYSQL_DATABASE: rag_flow
    volumes:
      - ragflow_mysql_data:/var/lib/mysql
    networks:
      - medpaper-net
    deploy:
      resources:
        limits:
          memory: 1G

  ragflow-redis:
    image: redis:7-alpine
    container_name: medpaper-ragflow-redis
    restart: unless-stopped
    networks:
      - medpaper-net

  ragflow-es:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    container_name: medpaper-ragflow-es
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ragflow_es_data:/usr/share/elasticsearch/data
    networks:
      - medpaper-net
    deploy:
      resources:
        limits:
          memory: 3G

  ragflow-minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    container_name: medpaper-ragflow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ACCESS_KEY: ragflow_minio
      MINIO_SECRET_KEY: ragflow_minio_dev_pwd
    volumes:
      - ragflow_minio_data:/data
    networks:
      - medpaper-net

  ragflow:
    image: infiniflow/ragflow:v0.12.0
    container_name: medpaper-ragflow
    restart: unless-stopped
    depends_on:
      - ragflow-mysql
      - ragflow-redis
      - ragflow-es
      - ragflow-minio
    ports:
      - "9380:9380"     # Web UI + API
      - "9381:9381"     # Document parser worker
    environment:
      MYSQL_HOST: ragflow-mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ragflow_dev_pwd
      MYSQL_DB: rag_flow
      REDIS_HOST: ragflow-redis
      REDIS_PORT: "6379"
      ELASTICSEARCH_HOST: ragflow-es
      ELASTICSEARCH_PORT: "9200"
      MINIO_HOST: ragflow-minio
      MINIO_PORT: "9000"
      MINIO_USER: ragflow_minio
      MINIO_PASS: ragflow_minio_dev_pwd
    networks:
      - medpaper-net
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9380/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

volumes:
  ragflow_mysql_data:
    name: medpaper_ragflow_mysql_data
  ragflow_es_data:
    name: medpaper_ragflow_es_data
  ragflow_minio_data:
    name: medpaper_ragflow_minio_data
