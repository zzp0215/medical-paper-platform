[pytest]
# ============================================
# Pytest 全局配置
# ============================================
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 标记
markers =
    unit: 纯单元测试, 不依赖外部服务 (默认跑)
    integration: 集成测试, 需 DB/Redis 等基础服务
    db: 需要 PostgreSQL (`pytest -m db`)
    e2e: 端到端测试 (`pytest -m e2e`)
    slow: 慢测试 (>5s, 平时跳过)

# 默认过滤: 跑 unit, 跳过 e2e/slow
addopts = -m "not db and not e2e and not slow" --tb=short -q

# 异步
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
