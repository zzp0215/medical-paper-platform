# ============================================
# Alembic 配置 (Phase 1.1.4)
# ============================================
# 初始化:  alembic init alembic   (已完成, 模板见 alembic/env.py)
# 生成迁移: alembic revision --autogenerate -m "init schema"
# 执行:     alembic upgrade head
# 回滚:     alembic downgrade -1
# 历史:     alembic history
# ============================================

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# sqlalchemy.url 从 env.py 动态读取 (避免硬编码密码)

[post_write_hooks]
# 自动 ruff 格式化迁移脚本
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
